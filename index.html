<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আল কুরআন</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- Premium Color Variables --- */
        :root {
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --primary: #059669; /* Emerald Green */
            --primary-gradient: linear-gradient(135deg, #059669, #047857);
            --primary-light: #D1FAE5;
            --text-main: #0F172A;
            --text-mut: #64748B;
            --border: #E2E8F0;
            --shadow-sm: 0 4px 6px -1px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
            --player-bg: rgba(255, 255, 255, 0.85);
            
            --arabic-font-size: 34px;
            --bn-font-size: 17px;
        }

        /* --- Dark Mode Variables --- */
        [data-theme="dark"] {
            --bg: #0F172A; /* Slate 900 */
            --surface: #1E293B; /* Slate 800 */
            --primary: #10B981;
            --primary-gradient: linear-gradient(135deg, #047857, #064E3B);
            --primary-light: #064E3B;
            --text-main: #F8FAFC;
            --text-mut: #94A3B8;
            --border: #334155;
            --shadow-sm: 0 4px 6px -1px rgba(0,0,0,0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.5);
            --player-bg: rgba(30, 41, 59, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans Bengali', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: var(--bg);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
        }

        /* --- Header Premium --- */
        .app-header {
            background: var(--primary-gradient);
            padding: 25px 20px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 0 0 24px 24px;
            box-shadow: var(--shadow-sm);
            position: relative;
            z-index: 10;
        }

        .app-title {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .icon-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: #ffffff;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        /* --- Sticky Tools (Search & Tabs) --- */
        .tools-section {
            padding: 20px 15px 10px;
            background-color: var(--bg);
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 15px;
        }

        .search-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-mut);
        }

        .search-box {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background-color: var(--surface);
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            box-shadow: var(--shadow-sm);
        }

        .search-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        .tabs {
            display: flex;
            background-color: var(--surface);
            border-radius: 12px;
            padding: 5px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background-color: transparent;
            color: var(--text-mut);
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: #ffffff;
            box-shadow: var(--shadow-sm);
        }

        /* --- Surah List --- */
        .surah-list {
            height: calc(100vh - 200px);
            overflow-y: auto;
            padding: 10px 15px 25px;
        }

        .surah-list::-webkit-scrollbar { width: 5px; }
        .surah-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

        .surah-card {
            background-color: var(--surface);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            border: 1px solid transparent;
        }

        .surah-card:active {
            transform: scale(0.98);
        }

        .surah-num-box {
            width: 48px;
            height: 48px;
            background-color: var(--bg);
            color: var(--primary);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: 700;
            margin-right: 15px;
            border: 1px solid var(--border);
            transform: rotate(45deg);
        }
        
        .surah-num-box span {
            transform: rotate(-45deg);
        }

        .surah-info { flex: 1; }
        .surah-name-bn { font-size: 18px; font-weight: 700; color: var(--text-main); margin-bottom: 5px; }
        .surah-meta-text { font-size: 13px; color: var(--text-mut); display: flex; align-items: center; gap: 5px; }
        .fav-btn { font-size: 22px; color: var(--border); padding: 8px; }
        .fav-btn.active { color: #EF4444; }

        /* --- Detail View --- */
        #detail-view {
            height: 100%;
            display: none;
            flex-direction: column;
            background-color: var(--bg);
        }

        .detail-header-info { text-align: center; color: #fff; flex: 1; }
        .detail-header-info h2 { font-size: 22px; font-weight: 700; }
        .detail-header-info p { font-size: 13px; opacity: 0.9; margin-top: 3px; }

        #settings-panel {
            display: none;
            background-color: var(--surface);
            padding: 100px;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            position: absolute;
            width: 100%;
            z-index: 9;
        }

        .bismillah {
            text-align: center;
            font-family: 'Amiri', serif;
            font-size: 30px;
            color: var(--primary);
            padding: 25px 0 10px;
        }

        .ayah-list {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 140px;
            scroll-behavior: smooth;
        }

        .ayah-list::-webkit-scrollbar { width: 5px; }
        .ayah-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

        .ayah-item {
            background-color: var(--surface);
            margin: 15px;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ayah-item.active {
            border-color: var(--primary);
            background-color: var(--primary-light);
        }

        .ayah-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .ayah-badge {
            background-color: var(--primary);
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: var(--arabic-font-size);
            text-align: right;
            line-height: 2;
            color: var(--text-main);
            margin-bottom: 20px;
        }

        .trans-text {
            font-size: var(--bn-font-size);
            color: var(--text-main);
            line-height: 1.7;
            text-align: justify;
        }

        /* --- Floating Player (Glassmorphism) --- */
        .player-wrapper {
            position: absolute;
            bottom: 20px;
            left: 5%;
            width: 90%;
            background: var(--player-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.15), 0 0 0 1px rgba(255,255,255,0.1) inset;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 100;
        }

        [data-theme="dark"] .player-wrapper {
            border: 1px solid rgba(255,255,255,0.05);
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 18px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        .player-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .play-btn-main {
            width: 60px;
            height: 60px;
            background: var(--primary-gradient);
            color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(5, 150, 105, 0.4);
        }

        .ctrl-btn { background: none; border: none; font-size: 24px; color: var(--text-main); cursor: pointer; padding: 10px; }
        .ayah-indicator { font-size: 15px; font-weight: 700; color: var(--text-mut); width: 50px; text-align: center; }

        .loader-box { text-align: center; padding: 50px; color: var(--primary); }
        .loading-text { font-size: 14px; color: var(--text-mut); text-align: center; padding: 10px; font-weight: 600; }
    </style>
</head>
<body>

<div id="app-container">
    
    <div id="index-view" style="display: flex; flex-direction: column; height: 100%;">
        <div class="app-header">
            <div class="app-title">আল কুরআন</div>
            <button class="icon-btn" onclick="toggleThemeManually()"><i class="fas fa-moon" id="theme-icon"></i></button>
        </div>

        <div class="tools-section">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" class="search-box" id="search-input" placeholder="সূরা খুঁজুন..." onkeyup="searchSurah()">
            </div>
            <div class="tabs">
                <button class="tab-btn active" id="tab-all" onclick="switchTab('all')">সব সূরা</button>
                <button class="tab-btn" id="tab-fav" onclick="switchTab('fav')">ফেভারিট <i class="fas fa-heart" style="color:#EF4444; margin-left:3px;"></i></button>
            </div>
        </div>

        <div class="surah-list" id="surah-list">
            <div class="loader-box"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
        </div>
    </div>

    <div id="detail-view">
        <div class="app-header" style="border-radius: 0;">
            <button class="icon-btn" onclick="goBackFromDetail()"><i class="fas fa-arrow-left"></i></button>
            <div class="detail-header-info">
                <h2 id="header-surah-name">নাম</h2>
                <p id="header-surah-meta">তথ্য</p>
            </div>
            <button class="icon-btn" onclick="toggleSettings()"><i class="fas fa-cog"></i></button>
        </div>

        <div id="settings-panel">
            <div style="margin-bottom: 15px;">
                <label style="display: flex; justify-content: space-between; color: var(--text-main); font-weight:600; margin-bottom:8px;">আরবি সাইজ: <span id="ar-size-val">34px</span></label>
                <input type="range" id="arabic-size" min="20" max="60" value="34" style="width:100%; accent-color: var(--primary);" oninput="updateFontSize()">
            </div>
            <div>
                <label style="display: flex; justify-content: space-between; color: var(--text-main); font-weight:600; margin-bottom:8px;">অনুবাদ সাইজ: <span id="bn-size-val">17px</span></label>
                <input type="range" id="bangla-size" min="12" max="30" value="17" style="width:100%; accent-color: var(--primary);" oninput="updateFontSize()">
            </div>
        </div>

        <div class="ayah-list" id="ayah-list"></div>

        <div class="player-wrapper">
            <div class="progress-bar-container" id="progress-bar" onclick="seekAudio(event)">
                <div class="progress-fill" id="progress"></div>
            </div>
            <div class="player-controls">
                <div class="ayah-indicator" id="current-ayah-num">০</div>
                <button class="ctrl-btn" onclick="prevAyah()"><i class="fas fa-backward-step"></i></button>
                <button class="play-btn-main" onclick="togglePlay()"><i class="fas fa-play" id="play-icon" style="margin-left:4px;"></i></button>
                <button class="ctrl-btn" onclick="stopAudio()"><i class="fas fa-stop"></i></button>
                <button class="ctrl-btn" onclick="nextAyah()"><i class="fas fa-forward-step"></i></button>
                <div class="ayah-indicator" id="total-ayah-num">০</div>
            </div>
            <audio id="quran-audio" style="display:none;" preload="auto"></audio>
        </div>
    </div>

</div>

<script>
    // --- Live Theme Sync ---
    const systemThemeMedia = window.matchMedia('(prefers-color-scheme: dark)');
    const themeIcon = document.getElementById('theme-icon');

    function updateThemeUI(isDark) {
        if (isDark) {
            document.body.setAttribute('data-theme', 'dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        } else {
            document.body.setAttribute('data-theme', 'light');
            themeIcon.classList.replace('fa-sun', 'fa-moon');
        }
    }

    function initTheme() {
        const userSavedTheme = localStorage.getItem('userSetTheme');
        if (userSavedTheme) updateThemeUI(userSavedTheme === 'dark');
        else updateThemeUI(systemThemeMedia.matches);
    }

    systemThemeMedia.addEventListener('change', (e) => {
        if (!localStorage.getItem('userSetTheme')) updateThemeUI(e.matches);
    });

    function toggleThemeManually() {
        const isCurrentlyDark = document.body.getAttribute('data-theme') === 'dark';
        const newThemeDark = !isCurrentlyDark;
        updateThemeUI(newThemeDark);
        localStorage.setItem('userSetTheme', newThemeDark ? 'dark' : 'light');
    }

    initTheme();

    // --- Data Variables ---
    const banglaSurahNames = [
        "আল ফাতিহা", "আল বাকারা", "আল ইমরান", "আন নিসা", "আল মায়িদাহ", "আল আনআম", "আল আরাফ", "আল আনফাল", "আত তাওবাহ", "ইউনুস",
        "হুদ", "ইউসুফ", "আর রাদ", "ইবরাহিম", "আল হিজর", "আন নাহল", "বনী ইসরাইল", "আল কাহফ", "মারইয়াম", "ত্বা হা",
        "আল আম্বিয়া", "আল হাজ্জ", "আল মুমিনুন", "আন নূর", "আল ফুরকান", "আশ শুআরা", "আন নামল", "আল কাসাস", "আল আনকাবুত", "আর রুম",
        "লুকমান", "আস সাজদাহ", "আল আহযাব", "সাবা", "ফাতির", "ইয়া সীন", "আস সাফফাত", "সোয়াদ", "আয যুমার", "গাফির",
        "হা মীম সাজদাহ", "আশ শূরা", "আয যুখরুফ", "আদ দুখান", "আল জাসিয়াহ", "আল আহকাফ", "মুহাম্মদ", "আল ফাতহ", "আল হুজুরাত", "কাফ",
        "আয যারিয়াত", "আত্ব তূর", "আন নাজম", "আল কামার", "আর রহমান", "আল ওয়াকিয়াহ", "আল হাদিদ", "আল মুজাদিলাহ", "আল হাশর", "আল মুমতাহিনাহ",
        "আস সাফ", "আল জুমুআহ", "আল মুনাফিকুন", "আত তাগাবুন", "আত তালাক", "আত তাহরীম", "আল মুলক", "আল কালাম", "আল হাক্কাহ", "আল মাআরিজ",
        "নূহ", "আল জ্বিন", "আল মুয্যাম্মিল", "আল মুদ্দাসসির", "আল কিয়ামাহ", "আদ দাহর", "আল মুরসালাত", "আন নাবা", "আন নাযিয়াত", "আবাসা",
        "আত তাকভীর", "আল ইনফিতার", "আল মুতাফফিফীন", "আল ইনশিকাক", "আল বুরূজ", "আত তারিক", "আল আলা", "আল গাশিয়াহ", "আল ফজর", "আল বালাদ",
        "আশ শামস", "আল লাইল", "আদ দুহা", "আল ইনশিরাহ", "আত ত্বীন", "আল আলাক", "আল কদর", "আল বাইয়্যিনাহ", "আয যিলযাল", "আল আদিয়াত",
        "আল কারিয়াহ", "আত তাকাসুর", "আল আসর", "আল হুমাযাহ", "আল ফীল", "কুরাইশ", "আল মাউন", "আল কাওসার", "আল কাফিরুন", "আন নাসর",
        "আল লাহাব", "আল ইখলাস", "আল ফালাক", "আন নাস"
    ];

    let allSurahs = [];
    let favoriteSurahs = JSON.parse(localStorage.getItem('favSurahs')) || [];
    let currentTab = 'all';
    
    let currentAyahs = [];
    let currentPlayingIndex = 0;
    let isPlaying = false;
    let currentSurahName = "";
    let currentSurahNumber = 0;

    // Progressive Loading Variables
    let renderedAyahCount = 0;
    const CHUNK_SIZE = 15; // প্রতিবারে ১৫টি আয়াত লোড হবে

    const surahListDiv = document.getElementById('surah-list');
    const ayahListDiv = document.getElementById('ayah-list');
    const audioEl = document.getElementById('quran-audio');
    const playIcon = document.getElementById('play-icon');
    const progressBar = document.getElementById('progress');

    // Fetch Index
    async function fetchSurahs() {
        try {
            const response = await fetch('https://api.alquran.cloud/v1/surah');
            const data = await response.json();
            allSurahs = data.data;
            renderIndex(allSurahs);
        } catch (error) {
            surahListDiv.innerHTML = '<div class="loader-box">ইন্টারনেট সমস্যা। আবার চেক করুন।</div>';
        }
    }

    function renderIndex(surahsToRender) {
        surahListDiv.innerHTML = '';
        if(surahsToRender.length === 0) {
            surahListDiv.innerHTML = '<div class="loader-box" style="color:var(--text-mut)">কোনো সূরা পাওয়া যায়নি</div>';
            return;
        }

        surahsToRender.forEach(surah => {
            const isFav = favoriteSurahs.includes(surah.number);
            const favClass = isFav ? 'fas fa-heart active' : 'far fa-heart';
            const surahBanglaName = banglaSurahNames[surah.number - 1]; 
            const typeText = surah.revelationType === "Meccan" ? "মাক্কী" : "মাদানী";

            const div = document.createElement('div');
            div.className = 'surah-card';
            div.innerHTML = `
                <div class="surah-num-box"><span>${engToBng(surah.number)}</span></div>
                <div class="surah-info" onclick="openSurah(${surah.number}, '${surahBanglaName}', ${surah.numberOfAyahs})">
                    <div class="surah-name-bn">${surahBanglaName}</div>
                    <div class="surah-meta-text"><i class="fas fa-book-open"></i> ${typeText} • আয়াত: ${engToBng(surah.numberOfAyahs)}</div>
                </div>
                <div class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, ${surah.number})">
                    <i class="${favClass}"></i>
                </div>
            `;
            surahListDiv.appendChild(div);
        });
    }

    function toggleFavorite(event, num) {
        event.stopPropagation();
        const idx = favoriteSurahs.indexOf(num);
        if (idx > -1) favoriteSurahs.splice(idx, 1);
        else favoriteSurahs.push(num);
        
        localStorage.setItem('favSurahs', JSON.stringify(favoriteSurahs));
        currentTab === 'fav' ? filterFavorites() : searchSurah();
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tab-all').classList.remove('active');
        document.getElementById('tab-fav').classList.remove('active');
        document.getElementById('search-input').value = '';
        tab === 'all' ? renderIndex(allSurahs) : filterFavorites();
    }

    function filterFavorites() {
        document.getElementById('tab-fav').classList.add('active');
        renderIndex(allSurahs.filter(s => favoriteSurahs.includes(s.number)));
    }

    function searchSurah() {
        const query = document.getElementById('search-input').value.toLowerCase();
        let baseList = currentTab === 'fav' ? allSurahs.filter(s => favoriteSurahs.includes(s.number)) : allSurahs;
        renderIndex(baseList.filter(s => banglaSurahNames[s.number - 1].includes(query) || s.englishName.toLowerCase().includes(query)));
    }

    // --- Detail View (With Lazy Loading) ---
    async function openSurah(surahNumber, surahName, totalAyahs) {
        history.pushState({view: 'detail'}, '');
        document.getElementById('index-view').style.display = 'none';
        document.getElementById('detail-view').style.display = 'flex';
        document.getElementById('settings-panel').style.display = 'none';
        
        currentSurahName = surahName;
        currentSurahNumber = surahNumber;
        document.getElementById('header-surah-name').innerText = surahName;
        document.getElementById('header-surah-meta').innerText = `সূরা: ${engToBng(surahNumber)} | আয়াত: ${engToBng(totalAyahs)}`;
        ayahListDiv.innerHTML = '<div class="loader-box"><i class="fas fa-spinner fa-spin fa-2x"></i><p style="margin-top:10px;font-size:14px;">লোড হচ্ছে...</p></div>';
        
        stopAudio();
        document.getElementById('total-ayah-num').innerText = engToBng(totalAyahs);
        document.getElementById('current-ayah-num').innerText = engToBng(1);

        try {
            const response = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/editions/quran-uthmani,bn.bengali,ar.alafasy`);
            const data = await response.json();
            
            const [arabicData, bengaliData, audioData] = data.data;

            currentAyahs = arabicData.ayahs.map((ayah, i) => ({
                id: ayah.numberInSurah,
                arabic: ayah.text,
                translation: bengaliData.ayahs[i].text,
                audioUrl: audioData.ayahs[i].audio
            }));

            // Reset Rendering
            renderedAyahCount = 0;
            ayahListDiv.innerHTML = ''; 

            // Add Bismillah header if needed
            if(surahNumber !== 1 && surahNumber !== 9) {
                ayahListDiv.innerHTML = `<div class="bismillah">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>`;
            }

            // Render first chunk instantly
            renderNextChunk();
            loadAudio(0); 

        } catch (error) {
            ayahListDiv.innerHTML = '<div class="loader-box" style="color:red;">ডাটা লোড করতে সমস্যা হয়েছে।</div>';
        }
    }

    // Progressive Chunk Renderer
    function renderNextChunk() {
        if (renderedAyahCount >= currentAyahs.length) return; // All rendered

        let end = Math.min(renderedAyahCount + CHUNK_SIZE, currentAyahs.length);
        let chunkToRender = currentAyahs.slice(renderedAyahCount, end);
        
        let chunkHtml = chunkToRender.map((ayah, i) => {
            let actualIndex = renderedAyahCount + i;
            let arabicText = ayah.arabic;
            
            // Remove extra Bismillah from text if it's not Fatiha
            if(currentSurahNumber !== 1 && ayah.id === 1 && arabicText.startsWith("بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ")) {
                arabicText = arabicText.replace("بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ", "");
            }

            return `
            <div class="ayah-item" id="ayah-${actualIndex}">
                <div class="ayah-top">
                    <div class="ayah-badge">আয়াত ${engToBng(ayah.id)}</div>
                </div>
                <div class="arabic-text">${arabicText} ۝</div>
                <div class="trans-text">${ayah.translation}</div>
            </div>`;
        }).join('');

        // Remove loading text if it exists
        const loadingText = document.getElementById('lazy-loader');
        if (loadingText) loadingText.remove();

        ayahListDiv.insertAdjacentHTML('beforeend', chunkHtml);
        renderedAyahCount = end;

        // Add a small loading indicator at the bottom if more ayahs exist
        if (renderedAyahCount < currentAyahs.length) {
            ayahListDiv.insertAdjacentHTML('beforeend', `<div id="lazy-loader" class="loading-text"><i class="fas fa-spinner fa-spin"></i> আরো লোড হচ্ছে...</div>`);
        }
    }

    // Scroll Event Listener for Lazy Loading
    ayahListDiv.addEventListener('scroll', function() {
        // If user scrolls near the bottom (within 300px), load the next chunk
        if (this.scrollTop + this.clientHeight >= this.scrollHeight - 300) {
            renderNextChunk();
        }
    });

    // Audio Player
    function loadAudio(index) {
        if(index >= currentAyahs.length || index < 0) return;
        currentPlayingIndex = index;

        // *** Auto-render if audio reaches an unrendered ayah ***
        while (index >= renderedAyahCount && renderedAyahCount < currentAyahs.length) {
            renderNextChunk();
        }

        audioEl.src = currentAyahs[index].audioUrl;
        document.getElementById('current-ayah-num').innerText = engToBng(currentAyahs[index].id);
        
        document.querySelectorAll('.ayah-item').forEach(el => el.classList.remove('active'));
        const activeAyahEl = document.getElementById(`ayah-${index}`);
        if(activeAyahEl) {
            activeAyahEl.classList.add('active');
            
            // Smooth Scroll to Ayah
            const listRect = ayahListDiv.getBoundingClientRect();
            const elRect = activeAyahEl.getBoundingClientRect();
            if (elRect.top < listRect.top || elRect.bottom > listRect.bottom) {
                ayahListDiv.scrollTo({
                    top: activeAyahEl.offsetTop - ayahListDiv.offsetTop - 20,
                    behavior: 'smooth'
                });
            }
        }
        updateMediaSession();
    }

    function updateMediaSession() {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: `${currentSurahName} - আয়াত ${engToBng(currentAyahs[currentPlayingIndex].id)}`,
                artist: 'আল কুরআন তিলাওয়াত',
                album: 'আল কুরআন অ্যাপ',
                artwork: [{ src: 'https://cdn-icons-png.flaticon.com/512/3364/3364239.png', sizes: '512x512', type: 'image/png' }]
            });
            navigator.mediaSession.setActionHandler('play', () => { audioEl.play(); isPlaying = true; updatePlayIcon(); });
            navigator.mediaSession.setActionHandler('pause', () => { audioEl.pause(); isPlaying = false; updatePlayIcon(); });
            navigator.mediaSession.setActionHandler('previoustrack', prevAyah);
            navigator.mediaSession.setActionHandler('nexttrack', nextAyah);
        }
    }

    function togglePlay() {
        if(currentAyahs.length === 0) return; 
        isPlaying ? audioEl.pause() : audioEl.play().catch(e => console.log(e));
        isPlaying = !isPlaying;
        updatePlayIcon();
    }

    function updatePlayIcon() {
        playIcon.classList.replace(isPlaying ? 'fa-play' : 'fa-pause', isPlaying ? 'fa-pause' : 'fa-play');
        playIcon.style.marginLeft = isPlaying ? '0' : '4px'; 
    }

    function stopAudio() {
        audioEl.pause();
        audioEl.currentTime = 0;
        isPlaying = false;
        updatePlayIcon();
        progressBar.style.width = '0%';
    }

    function nextAyah() {
        if(currentPlayingIndex < currentAyahs.length - 1) {
            loadAudio(currentPlayingIndex + 1);
            if(isPlaying) audioEl.play().catch(e => console.log(e));
        } else { stopAudio(); }
    }

    function prevAyah() {
        if(currentPlayingIndex > 0) {
            loadAudio(currentPlayingIndex - 1);
            if(isPlaying) audioEl.play().catch(e => console.log(e));
        }
    }

    audioEl.addEventListener('ended', nextAyah);
    audioEl.addEventListener('timeupdate', () => {
        if(audioEl.duration) progressBar.style.width = `${(audioEl.currentTime / audioEl.duration) * 100}%`;
    });

    function seekAudio(e) {
        if(audioEl.duration) audioEl.currentTime = (e.offsetX / e.target.clientWidth) * audioEl.duration;
    }

    function toggleSettings() {
        const panel = document.getElementById('settings-panel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    }

    function updateFontSize() {
        const arSize = document.getElementById('arabic-size').value;
        const bnSize = document.getElementById('bangla-size').value;
        document.documentElement.style.setProperty('--arabic-font-size', arSize + 'px');
        document.documentElement.style.setProperty('--bn-font-size', bnSize + 'px');
        document.getElementById('ar-size-val').innerText = arSize + 'px';
        document.getElementById('bn-size-val').innerText = bnSize + 'px';
    }

    window.onpopstate = function() {
        if (document.getElementById('detail-view').style.display === 'flex') {
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('index-view').style.display = 'flex';
        }
    };

    function goBackFromDetail() { history.back(); }
    function engToBng(number) {
        const bngNumbers = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
        return number.toString().split('').map(n => bngNumbers[n] || n).join('');
    }

    fetchSurahs();

</script>
