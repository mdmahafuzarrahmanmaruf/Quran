<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আল কুরআন</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #F0F4F8; --surface: #FFFFFF; --primary: #059669; --primary-dark: #047857;
            --primary-light: #D1FAE5; --text-main: #1E293B; --text-mut: #64748B; --border: #E2E8F0;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --bn-font-size: 18px; --ar-font-size: 34px;
        }

        [data-theme="dark"] {
            --bg: #0F172A; --surface: #1E293B; --text-main: #F1F5F9;
            --text-mut: #94A3B8; --border: #334155; --primary-light: #064E3B;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Bengali', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #1a1a1a; display: flex; justify-content: center; height: 100vh; overflow: hidden; }

        #app-container { width: 100%; max-width: 500px; background-color: var(--bg); height: 100vh; position: relative; display: flex; flex-direction: column; box-shadow: 0 0 50px rgba(0,0,0,0.5); overflow: hidden; }

        .app-header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); padding: 20px; color: white; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); z-index: 100; }
        .header-title h1 { font-size: 22px; font-weight: 800; }
        .icon-btn { background: rgba(255,255,255,0.15); border: none; width: 42px; height: 42px; border-radius: 12px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }

        .top-tools { padding: 15px; background: var(--surface); border-bottom: 1px solid var(--border); }
        .search-wrapper { position: relative; margin-bottom: 15px; }
        .search-box { width: 100%; padding: 12px 15px; border-radius: 12px; border: 2px solid var(--border); background: var(--bg); color: var(--text-main); font-size: 16px; outline: none; }
        
        .tabs { display: flex; gap: 10px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 10px; background: var(--bg); color: var(--text-mut); font-weight: 700; cursor: pointer; }
        .tab-btn.active { background: var(--primary); color: white; }

        .main-content { flex: 1; overflow-y: auto; padding: 15px; }
        .surah-card { background: var(--surface); padding: 15px; border-radius: 16px; margin-bottom: 12px; display: flex; align-items: center; border: 1px solid var(--border); cursor: pointer; }
        .surah-idx { width: 45px; height: 45px; background: var(--primary-light); color: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; margin-right: 15px; font-size: 18px; }
        .surah-info { flex: 1; }
        .surah-name { font-size: 19px; font-weight: 500; color: var(--text-main); margin-bottom: 4px; }
        .surah-meta { font-size: 13px; color: var(--text-mut); font-weight: 600; }

        #detail-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 200; display: none; flex-direction: column; }

        /* Settings Panel */
        #settings-panel { display: none; background: var(--surface); padding: 20px; border-bottom: 1px solid var(--border); box-shadow: var(--shadow); position: absolute; top: 82px; width: 100%; z-index: 150; max-height: 80vh; overflow-y: auto;}
        .setting-row { margin-bottom: 15px; }
        .setting-row label { display: block; font-weight: 500; color: var(--text-main); margin-bottom: 8px; font-size: 14px; }
        .setting-row select, .setting-row input[type="range"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text-main); font-weight: 600; }

        .ayah-container { flex: 1; overflow-y: auto; padding: 15px 15px 120px; scroll-behavior: smooth; }
        .ayah-card { background: var(--surface); padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid var(--border); }
        .ayah-card.playing { border-color: var(--primary); background: var(--primary-light); }
        .ayah-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .ayah-num { background: var(--primary); color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; }
        .ayah-tools { display: flex; gap: 15px; color: var(--text-mut); font-size: 18px; }
        
        .ar-txt { font-family: 'Amiri', serif; font-size: var(--ar-font-size); text-align: right; line-height: 2.2; color: var(--text-main); margin-bottom: 15px; font-weight: 400; }
        .bn-txt { font-size: var(--bn-font-size); color: var(--text-main); line-height: 1.8; font-weight: 500; text-align: justify; }

        .player-bar { position: absolute; bottom: 20px; left: 15px; right: 15px; background: var(--surface); padding: 15px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 1px solid var(--border); z-index: 300; }
        .progress-cont { height: 6px; background: var(--border); border-radius: 10px; margin-bottom: 15px; cursor: pointer; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; border-radius: 10px;}
        .p-controls { display: flex; justify-content: space-between; align-items: center; }
        .main-play { width: 55px; height: 55px; background: var(--primary); color: white; border-radius: 50%; border: none; font-size: 20px; cursor: pointer; }

        #toast { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 30px; font-size: 14px; display: none; z-index: 1000; font-weight: bold;}
    </style>
</head>
<body>

<div id="app-container">
    <div id="index-view" style="display: flex; flex-direction: column; height: 100%;">
        <div class="app-header">
            <div class="header-title"><h1>আল কুরআন</h1></div>
            <button class="icon-btn" onclick="toggleTheme()"><i class="fas fa-moon" id="theme-icon"></i></button>
        </div>

        <div class="top-tools">
            <div class="search-wrapper">
                <input type="text" class="search-box" id="surah-search" placeholder="সূরার নাম লিখে খুঁজুন..." onkeyup="filterSurahs()">
            </div>
            <div class="tabs">
                <button class="tab-btn active" id="btn-all" onclick="showTab('all')">সব সূরা</button>
                <button class="tab-btn" id="btn-juz" onclick="showTab('juz')">পারা</button>
                <button class="tab-btn" id="btn-fav" onclick="showTab('fav')">ফেভারিট</button>
            </div>
        </div>

        <div class="main-content" id="surah-list"></div>
    </div>

    <div id="detail-view">
        <div class="app-header">
            <button class="icon-btn" onclick="closeDetail()"><i class="fas fa-arrow-left"></i></button>
            <div style="text-align:center">
                <h2 id="det-name" style="font-size:18px; font-weight:800;">সুরা</h2>
                <span id="det-meta" style="font-size:11px; opacity:0.8;">তথ্য</span>
            </div>
            <button class="icon-btn" onclick="toggleSettings()"><i class="fas fa-sliders"></i></button>
        </div>

        <div id="settings-panel">
            <div class="setting-row">
                <label>ক্বারী নির্বাচন করুন</label>
                <select id="reciter-select" onchange="changeReciter()">
                    <option value="ar.alafasy">মিশারি রশিদ আল-আফাসি</option>
                    <option value="ar.abdulsamad">আব্দুল বাসিত</option>
                    <option value="ar.abdurrahmaansudais">আস-সুদাইস</option>
                </select>
            </div>
            <div style="display:flex; gap:15px;">
                <div class="setting-row" style="flex:1">
                    <label>অডিও স্পিড</label>
                    <select id="speed-select" onchange="updateAudioSpeed()">
                        <option value="0.75">0.75x</option><option value="1.0" selected>1.0x</option>
                        <option value="1.25">1.25x</option><option value="1.5">1.5x</option>
                    </select>
                </div>
                <div class="setting-row" style="flex:1">
                    <label>রিপিট মোড</label>
                    <select id="repeat-select">
                        <option value="1">১ বার</option><option value="3">৩ বার</option><option value="0">লুপ</option>
                    </select>
                </div>
            </div>
            <div class="setting-row">
                <label>আরবি লেখার আকার: <span id="ar-size-label">34px</span></label>
                <input type="range" min="20" max="60" value="34" oninput="changeArFontSize(this.value)">
            </div>
            <div class="setting-row">
                <label>বাংলা লেখার আকার: <span id="bn-size-label">18px</span></label>
                <input type="range" min="14" max="30" value="18" oninput="changeBnFontSize(this.value)">
            </div>
        </div>

        <div class="ayah-container" id="ayah-list"></div>

        <div class="player-bar">
            <div class="progress-cont" onclick="seek(event)"><div class="progress-fill" id="prog-fill"></div></div>
            <div class="p-controls">
                <div id="p-ayah-num" style="font-weight:800; color:var(--primary); width:30px;">১</div>
                <button class="icon-btn" style="color:var(--text-main)" onclick="playPrev()"><i class="fas fa-step-backward"></i></button>
                <button class="main-play" onclick="togglePlay()"><i class="fas fa-play" id="play-icon"></i></button>
                <button class="icon-btn" style="color:var(--text-main)" onclick="playNext()"><i class="fas fa-step-forward"></i></button>
                <div id="p-total" style="font-weight:800; color:var(--text-mut); width:30px;">৭</div>
            </div>
        </div>
    </div>
</div>

<div id="toast">মেসেজ</div>
<audio id="main-audio"></audio>

<script>
    const bngNames = ["আল ফাতিহা","আল বাকারা","আল ইমরান","আন নিসা","আল মায়িদাহ","আল আনআম","আল আরাফ","আল আনফাল","আত তাওবাহ","ইউনুস","হুদ","ইউসুফ","আর রাদ","ইবরাহিম","আল হিজর","আন নাহল","বনী ইসরাইল","আল কাহফ","মারইয়াম","ত্বা হা","আল আম্বিয়া","আল হাজ্জ","আল মুমিনুন","আন নূর","আল ফুরকান","আশ শুআরা","আন নামল","আল কাসাস","আল আনকাবুত","আর রুম","লুকমান","আস সাজদাহ","আল আহযাব","সাবা","ফাতির","ইয়া সীন","আস সাফফাত","সোয়াদ","আয যুমার","গাফির","হা মীম সাজদাহ","আশ শূরা","আয যুখরুফ","আদ দুখান","আল জাসিয়াহ","আল আহকাফ","মুহাম্মদ","আল ফাতহ","আল হুজুরাত","কাফ","আয যারিয়াত","আত্ব তূর","আন নাজম","আল কামার","আর রহমান","আল ওয়াকিয়াহ","আল হাদিদ","আল মুজাদিলাহ","আল হাশর","আল মুমতাহিনাহ","আস সাফ","আল জুমুআহ","আল মুনাফিকুন","আত তাগাবুন","আত তালাক","আত তাহরীম","আল মুলক","আল কালাম","আল হাক্কাহ","আল মাআরিজ","নূহ","আল জ্বিন","আল মুয্যাম্মিল","আল মুদ্দাসসির","আল কিয়ামাহ","আদ দাহর","আল মুরসালাত","আন নাবা","আন নাযিয়াত","আবাসা","আত তাকভীর","আল ইনফিতার","আল মুতাফফিফীন","আল ইনশিকাক","আল বুরূজ","আত তারিক","আল আলা","আল গাশিয়াহ","আল ফজর","আল বালাদ","আশ শামস","আল লাইল","আদ দুহা","আল ইনশিরাহ","আত ত্বীন","আল আলাক","আল কদর","আল বাইয়্যিনাহ","আয যিলযাল","আল আদিয়াত","আল কারিয়াহ","আত তাকাসুর","আল আসর","আল হুমাযাহ","আল ফীল","কুরাইশ","আল মাউন","আল কাওসার","আল কাফিরুন","আন নাসর","আল লাহাব","আল ইখলাস","আল ফালাক","আন নাস"];
    
    let allSurahs = [], currentAyahs = [], currentSNum = 1, playingIdx = 0, isPlaying = false;
    let reciter = 'ar.alafasy';
    let favorites = JSON.parse(localStorage.getItem('quran_favs')) || [];
    let currentTab = 'all';
    
    // Lazy Load variables
    let renderedCount = 0;
    const CHUNK_SIZE = 20;

    const audio = document.getElementById('main-audio');

    function toBng(n) { return n.toString().split('').map(d => "০১২৩৪৫৬৭৮৯"[d] || d).join(''); }
    function showToast(msg) {
        const t = document.getElementById('toast'); t.innerText = msg;
        t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2500);
    }

    // --- System Theme Detection ---
    const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
    
    function applyTheme(isDark) {
        const b = document.body;
        if(isDark) { b.setAttribute('data-theme', 'dark'); document.getElementById('theme-icon').className = 'fas fa-sun'; }
        else { b.removeAttribute('data-theme'); document.getElementById('theme-icon').className = 'fas fa-moon'; }
    }

    // Initial theme set based on phone settings
    applyTheme(systemTheme.matches);
    
    // Listen for phone theme changes
    systemTheme.addEventListener('change', e => applyTheme(e.matches));

    function toggleTheme() {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        applyTheme(!isDark); // Toggle manually
    }
    // ------------------------------

    // Hardware Back Button Fix
    window.addEventListener('popstate', (e) => {
        if (document.getElementById('detail-view').style.display === 'flex') {
            closeDetail(true);
        }
    });

    window.onload = async () => {
        const res = await fetch('https://api.alquran.cloud/v1/surah');
        allSurahs = (await res.json()).data;
        showTab('all');
    };

    function showTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + tab).classList.add('active');
        
        const container = document.getElementById('surah-list');
        container.innerHTML = '';

        if(tab === 'all') renderSurahList(allSurahs);
        else if(tab === 'fav') renderSurahList(allSurahs.filter(s => favorites.includes(s.number)));
        else if(tab === 'juz') {
            for(let i=1; i<=30; i++) {
                container.innerHTML += `<div class="surah-card" onclick="openJuz(${i})"><div class="surah-idx">${toBng(i)}</div><div class="surah-info"><div class="surah-name">পারা ${toBng(i)}</div></div></div>`;
            }
        }
    }

    function renderSurahList(list) {
        const container = document.getElementById('surah-list');
        container.innerHTML = '';
        if(list.length === 0) container.innerHTML = '<p style="text-align:center; padding:20px; color:gray;">কোনো সূরা পাওয়া যায়নি</p>';
        
        list.forEach(s => {
            const isFav = favorites.includes(s.number);
            container.innerHTML += `
                <div class="surah-card" onclick="openSurah(${s.number}, '${bngNames[s.number-1]}', ${s.numberOfAyahs}, '${s.revelationType}')">
                    <div class="surah-idx">${toBng(s.number)}</div>
                    <div class="surah-info">
                        <div class="surah-name">${bngNames[s.number-1]}</div>
                        <div class="surah-meta">${s.revelationType === 'Meccan' ? 'মাক্কী' : 'মাদানী'} • আয়াত: ${toBng(s.numberOfAyahs)}</div>
                    </div>
                    <i class="${isFav ? 'fas' : 'far'} fa-heart" style="color:${isFav ? '#EF4444' : '#cbd5e1'}; font-size:22px;" onclick="toggleFav(event, ${s.number})"></i>
                </div>`;
        });
    }

    async function openSurah(num, name, total, type) {
        history.pushState({view: 'detail'}, '', '#surah');
        currentSNum = num;
        setupDetailView(name, `${type === 'Meccan' ? 'মাক্কী' : 'মাদানী'} • আয়াত: ${toBng(total)}`);
        await fetchAndRender(`https://api.alquran.cloud/v1/surah/${num}/editions/quran-uthmani,bn.bengali,${reciter}`);
    }

    async function openJuz(num) {
        history.pushState({view: 'detail'}, '', '#juz');
        setupDetailView(`পারা ${toBng(num)}`, `বিস্তারিত`);
        await fetchAndRender(`https://api.alquran.cloud/v1/juz/${num}/editions/quran-uthmani,bn.bengali,${reciter}`);
    }

    function setupDetailView(title, meta) {
        document.getElementById('index-view').style.display = 'none';
        document.getElementById('detail-view').style.display = 'flex';
        document.getElementById('det-name').innerText = title;
        document.getElementById('det-meta').innerText = meta;
        document.getElementById('ayah-list').innerHTML = '<p style="text-align:center; padding:50px; font-weight:700;">লোড হচ্ছে...</p>';
    }

    async function fetchAndRender(url) {
        const res = await fetch(url);
        const data = await res.json();
        
        currentAyahs = data.data[0].ayahs.map((a, i) => ({
            ar: a.text, bn: data.data[1].ayahs[i].text,
            audio: data.data[2].ayahs[i].audio, num: a.numberInSurah || (i+1)
        }));

        document.getElementById('p-total').innerText = toBng(currentAyahs.length);
        
        // Start Lazy Loading
        renderAyahsChunk(true);
        loadAyahAudio(0);
    }

    // --- Lazy Loading Logic ---
    function renderAyahsChunk(reset = false) {
        const container = document.getElementById('ayah-list');
        if (reset) {
            container.innerHTML = '';
            renderedCount = 0;
        }

        const toRender = currentAyahs.slice(renderedCount, renderedCount + CHUNK_SIZE);
        if (toRender.length === 0) return;

        let html = '';
        toRender.forEach((a, i) => {
            const actualIndex = renderedCount + i;
            const cleanAr = a.ar.replace("بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ", "");
            html += `
                <div class="ayah-card" id="ayah-card-${actualIndex}">
                    <div class="ayah-header">
                        <span class="ayah-num">আয়াত ${toBng(a.num)}</span>
                        <div class="ayah-tools">
                            <i class="fas fa-copy" onclick="copyAyah(${actualIndex})"></i>
                            <i class="fas fa-share-alt" onclick="shareAyah(${actualIndex})"></i>
                        </div>
                    </div>
                    <div class="ar-txt">${cleanAr}</div>
                    <div class="bn-txt">${a.bn}</div>
                </div>`;
        });
        
        container.innerHTML += html;
        renderedCount += toRender.length;
    }

    // Scroll event listener for loading more Ayahs
    document.getElementById('ayah-list').addEventListener('scroll', function() {
        if (this.scrollTop + this.clientHeight >= this.scrollHeight - 300) {
            renderAyahsChunk();
        }
    });
    // ----------------------------

    function loadAyahAudio(idx) {
        // If we jump to an audio that hasn't rendered yet, render it
        while (idx >= renderedCount) {
            renderAyahsChunk();
        }

        playingIdx = idx;
        audio.src = currentAyahs[idx].audio;
        document.getElementById('p-ayah-num').innerText = toBng(idx + 1);
        
        document.querySelectorAll('.ayah-card').forEach(c => c.classList.remove('playing'));
        const activeCard = document.getElementById(`ayah-card-${idx}`);
        if(activeCard) {
            activeCard.classList.add('playing');
            // Scroll to the playing ayah
            activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        if(isPlaying) audio.play();
    }

    function togglePlay() {
        if(isPlaying) { audio.pause(); document.getElementById('play-icon').className = 'fas fa-play'; }
        else { audio.play(); document.getElementById('play-icon').className = 'fas fa-pause'; }
        isPlaying = !isPlaying;
    }

    function playNext() { if(playingIdx < currentAyahs.length - 1) loadAyahAudio(playingIdx + 1); else { isPlaying=false; document.getElementById('play-icon').className='fas fa-play'; } }
    function playPrev() { if(playingIdx > 0) loadAyahAudio(playingIdx - 1); }

    audio.onended = () => {
        const repeat = document.getElementById('repeat-select').value;
        if(repeat == "0") audio.play();
        else playNext();
    };

    audio.ontimeupdate = () => { if(audio.duration) document.getElementById('prog-fill').style.width = `${(audio.currentTime / audio.duration) * 100}%`; };
    function seek(e) { const rect = e.target.getBoundingClientRect(); audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration; }

    function toggleSettings() {
        const p = document.getElementById('settings-panel');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
    }

    function changeArFontSize(v) {
        document.documentElement.style.setProperty('--ar-font-size', v + 'px');
        document.getElementById('ar-size-label').innerText = v + 'px';
    }

    function changeBnFontSize(v) {
        document.documentElement.style.setProperty('--bn-font-size', v + 'px');
        document.getElementById('bn-size-label').innerText = v + 'px';
    }

    function changeReciter() {
        reciter = document.getElementById('reciter-select').value;
        toggleSettings();
        const isJuz = document.getElementById('det-name').innerText.includes('পারা');
        if(isJuz) {
            let num = parseInt(document.getElementById('det-name').innerText.replace('পারা ', ''));
            fetchAndRender(`https://api.alquran.cloud/v1/juz/${num}/editions/quran-uthmani,bn.bengali,${reciter}`);
        } else {
            fetchAndRender(`https://api.alquran.cloud/v1/surah/${currentSNum}/editions/quran-uthmani,bn.bengali,${reciter}`);
        }
    }

    function updateAudioSpeed() {
        audio.playbackRate = parseFloat(document.getElementById('speed-select').value);
    }

    function copyAyah(idx) {
        const a = currentAyahs[idx];
        navigator.clipboard.writeText(`${a.ar}\n\n${a.bn}`);
        showToast('আয়াত কপি হয়েছে!');
    }

    function shareAyah(idx) {
        const a = currentAyahs[idx];
        const text = `আয়াত ${toBng(a.num)}\n\n${a.ar}\n\n${a.bn}\n\n- আল কুরআন অ্যাপ`;
        if(navigator.share) navigator.share({ title: 'আল কুরআন', text: text });
        else copyAyah(idx); 
    }

    function toggleFav(e, num) {
        e.stopPropagation();
        if(favorites.includes(num)) favorites = favorites.filter(f => f !== num);
        else favorites.push(num);
        localStorage.setItem('quran_favs', JSON.stringify(favorites));
        if(currentTab === 'fav') showTab('fav');
        else showTab('all');
    }

    function closeDetail(fromPopState = false) {
        document.getElementById('detail-view').style.display = 'none';
        document.getElementById('index-view').style.display = 'flex';
        audio.pause(); isPlaying = false;
        document.getElementById('play-icon').className = 'fas fa-play';
        document.getElementById('settings-panel').style.display = 'none';
        
        if(!fromPopState) history.back(); 
    }

    function filterSurahs() {
        const q = document.getElementById('surah-search').value;
        if(currentTab === 'all') renderSurahList(allSurahs.filter(s => bngNames[s.number-1].includes(q)));
    }
</script>

</body>
                        </html>
